<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher Sign Up — Find My PE Class</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo-ball">
          <svg viewBox="0 0 24 24">
            <defs>
              <pattern id="logoPattern" patternUnits="userSpaceOnUse" width="24" height="24">
                <image href="assets/images/Logo for fitness brand 'RunFree'.png" width="20" height="20" x="2" y="2" preserveAspectRatio="xMidYMid slice"/>
              </pattern>
            </defs>
            <circle cx="12" cy="12" r="10" fill="url(#logoPattern)" />
          </svg>
        </div>
        <div>
          <h1>Teacher Sign Up</h1>
          <p class="muted">Create an account to manage locations and schedules</p>
        </div>
      </div>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="student.html">Student</a>
        <a href="teacher-signin.html">Teacher</a>
      </nav>
    </header>

    <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px);">
      <section class="card" style="padding:24px;max-width:420px;width:100%;margin:20px">
        <h2 style="text-align: center;">Create Teacher Account</h2>
        <div class="authCol" style="margin-top: 20px;">
          <input id="teacherNameInput" placeholder="Full name" />
          <input id="teacherEmail" placeholder="Email" />
          <input id="teacherPassword" placeholder="Password" type="password" />
          <button id="teacherSignUp" class="btn primary" style="margin-top: 10px;">Sign up</button>
          <div id="teacherMsg2" class="muted" style="margin-top:8px"></div>
          <div style="text-align: center; margin-top: 20px;">
            <p class="muted">Already have an account?</p>
            <a href="teacher-signin.html" class="btn">Sign in</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot card" style="text-align: center;">Copyright © 2025-2026</footer>
  </div>

  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
  <!-- Theme toggle -->
  <button class="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()"><span class="theme-icon">🌙</span></button>
</body>
</html>
