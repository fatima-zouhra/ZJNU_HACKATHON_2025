<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Find My PE Class — Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="page-wrap">
      <div class="topbar">
        <div class="brand">
          <div class="logo-ball">
            <svg viewBox="0 0 24 24">
              <defs>
                <pattern id="logoPattern" patternUnits="userSpaceOnUse" width="24" height="24">
                  <image href="assets/images/Logo for fitness brand 'RunFree'.png" width="20" height="20" x="2" y="2" preserveAspectRatio="xMidYMid slice"/>
                </pattern>
              </defs>
              <circle cx="12" cy="12" r="10" fill="url(#logoPattern)" />
            </svg>
          </div>
          <div>
            <h1>Create Account</h1>
            <p class="muted">Join us to save your classes and get notifications</p>
          </div>
        </div>

        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="student.html">sign in</a>
          
        </nav>
      </div>
    </div>
  </header>

    <main>
      <div class="background-container"></div>
      <div class="page-wrap">
        <div class="container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px);">
          <section class="card" style="padding:24px;max-width:420px;width:100%;">
            <h2 style="text-align: center;">Create New Account</h2>
        <div class="authCol" style="margin-top: 20px;">
          <input id="stuName" placeholder="Full name" />
          <input id="stuEmail2" placeholder="Email" />
          <input id="stuPassword2" placeholder="Password" type="password" />
          <button id="stuSignUp" class="btn primary" style="margin-top: 10px;">Sign up</button>
          <div id="stuMsg2" class="muted" style="margin-top:8px"></div>
          <div style="text-align: center; margin-top: 20px;">
            <p class="muted">Already have an account?</p>
            <a href="student.html" class="btn">Sign in</a>
          </div>
        </div>
      </section>
    </main>

          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="page-wrap">
        <div class="foot card" style="text-align: center;">
          <div>Copyright © 2025-2026</div>
        </div>
      </div>
    </footer>

    <!-- Floating Chat Button -->
    <a href="chat.html" class="floating-chat-btn">
      <div class="chat-icon">
        <img src="assets/images/chat logo.png" alt="Open Chat" />
      </div>
      <div class="chat-text">ASK ME!</div>
    </a>

    <script src="js/app.js"></script>
    <script src="js/theme.js"></script>
    <!-- Theme toggle -->
    <button class="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()"><span class="theme-icon">🌙</span></button>
    </body>
  </html>
